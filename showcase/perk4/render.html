<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/build/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './lib/examples/jsm/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from './lib/examples/jsm/geometries/RoundedBoxGeometry.js';
THREE.ColorManagement.legacyMode = false;
await document.fonts.load('700 200px Fredoka');

const q = new URLSearchParams(location.search);
const SC = q.get('scene'), W = +q.get('w'), H = +q.get('h');
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setSize(W, H); R.setClearColor(0, 0); R.outputEncoding = THREE.sRGBEncoding;
R.toneMapping = THREE.NoToneMapping;
document.body.appendChild(R.domElement);
const S = new THREE.Scene();
S.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.03).texture;

const LIME = 0xC6F432, PEARL = 0xDCD6CC, INK = 0x16161a;

// coin face: embossed "P" mark + ring, drawn once (colour map + bump map)
function faceTex(fg, bg) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, 512, 512);
  x.strokeStyle = fg; x.lineWidth = 14; x.beginPath(); x.arc(256, 256, 214, 0, Math.PI * 2); x.stroke();
  x.fillStyle = fg; x.font = '700 300px Fredoka'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('P', 262, 270);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
function bumpTex() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, 512, 512); x.strokeStyle = '#fff'; x.fillStyle = '#fff'; x.lineWidth = 14;
  x.beginPath(); x.arc(256, 256, 214, 0, Math.PI * 2); x.stroke(); x.font = '700 300px Fredoka'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('P', 262, 270);
  return new THREE.CanvasTexture(c);
}
const BUMP = bumpTex();
function coin(col) {
  const g = new THREE.Group(); const isLime = col === LIME;
  const body = new THREE.MeshStandardMaterial({ color: col, metalness: isLime ? .25 : .15, roughness: .28 });
  const pts = [[0, .06], [.78, .06], [.83, .095], [.97, .095], [1, .07], [1, -.07], [.97, -.095], [.83, -.095], [.78, -.06], [0, -.06]].map(([a, b]) => new THREE.Vector2(a, b));
  g.add(new THREE.Mesh(new THREE.LatheGeometry(pts.reverse(), 96), body));
  const tex = faceTex(isLime ? '#3c4a08' : '#a59d90', isLime ? '#C6F432' : '#DCD6CC');
  const fm = new THREE.MeshStandardMaterial({ map: tex, bumpMap: BUMP, bumpScale: 2.2, metalness: isLime ? .25 : .15, roughness: .3 });
  [1, -1].forEach(s => { const f = new THREE.Mesh(new THREE.CircleGeometry(.79, 96), fm); f.rotation.x = -s * Math.PI / 2; f.position.y = s * .0605; if (s < 0) f.scale.x = -1; g.add(f); });
  return g;
}
function bag() {
  const g = new THREE.Group();
  const bodyM = new THREE.MeshStandardMaterial({ color: LIME, roughness: .62, metalness: 0 });
  // front face carries a printed Perk mark
  const c = document.createElement('canvas'); c.width = 512; c.height = 600; const x = c.getContext('2d');
  x.fillStyle = '#C6F432'; x.fillRect(0, 0, 512, 600); x.fillStyle = '#16161a'; x.beginPath(); x.arc(256, 330, 118, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#C6F432'; x.font = '700 170px Fredoka'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('P', 262, 340);
  const ft = new THREE.CanvasTexture(c); ft.encoding = THREE.sRGBEncoding;
  const frontM = new THREE.MeshStandardMaterial({ map: ft, roughness: .62 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2, 1), [bodyM, bodyM, bodyM, bodyM, frontM, bodyM]);
  g.add(box);
  const inner = new THREE.Mesh(new THREE.BoxGeometry(1.6, .02, .9), new THREE.MeshStandardMaterial({ color: 0x5d7414, roughness: .9 })); inner.position.y = 1.0; g.add(inner);
  const hm = new THREE.MeshStandardMaterial({ color: INK, roughness: .5 });
  [.5, -.5].forEach(z => { const h = new THREE.Mesh(new THREE.TorusGeometry(.38, .045, 16, 48, Math.PI), hm); h.position.set(0, 1.0, z * .62); g.add(h); });
  return g;
}

let cam; const out = {};
if (SC === 'bag') {
  const b = bag(); b.position.set(-1.2, -1.4, 0); b.rotation.set(.18, .5, -.42); S.add(b);
  // coins burst out of the bag's mouth in an arc
  const C = [[-.2, .25, .6, LIME, [1.1, .3, .4]], [.55, 1.05, .7, PEARL, [.5, .9, -.3]], [1.45, 1.55, .78, LIME, [1.3, -.4, .6]], [.5, 2.25, .55, LIME, [.2, .2, 1.1]],
             [2.15, .7, .62, PEARL, [-.6, .8, .2]], [1.5, 2.85, .48, PEARL, [1.4, .1, -.8]], [2.55, 2.2, .5, LIME, [.9, -1, .3]], [-.6, 1.35, .45, PEARL, [-.4, .5, 1.3]]];
  C.forEach(([x, y, s, col, r]) => { const c = coin(col); c.position.set(x, y, Math.random() * .6); c.scale.setScalar(s); c.rotation.set(...r); S.add(c); });
  cam = new THREE.PerspectiveCamera(30, W / H, .1, 100); cam.position.set(0, .7, 11.5); cam.lookAt(.55, .55, 0);
} else if (SC === 'stacks') {
  const N = [5, 7, 6, 9, 13], X = [-2.3, -1.15, 0, 1.15, 2.3];
  N.forEach((n, i) => { for (let k = 0; k < n; k++) { const c = coin(i === 4 ? LIME : PEARL); c.scale.setScalar(.52); c.position.set(X[i] + Math.sin(k * 2.1 + i) * .03, k * .102 + .05, Math.cos(k * 1.7) * .04); c.rotation.y = k * .7; S.add(c); }
  });
  cam = new THREE.PerspectiveCamera(26, W / H, .1, 100); cam.position.set(0, 3.2, 10.2); cam.lookAt(0, .72, 0); cam.updateMatrixWorld();
  N.forEach((n, i) => { const p = new THREE.Vector3(X[i], n * .102 + .09, 0).project(cam); out['s' + i] = [Math.round((p.x + 1) / 2 * W), Math.round((1 - p.y) / 2 * H)];
    const b = new THREE.Vector3(X[i], 0, .7).project(cam); out['b' + i] = [Math.round((b.x + 1) / 2 * W), Math.round((1 - b.y) / 2 * H)]; });
} else if (SC === 'coin') {
  const c = coin(LIME); c.rotation.set(1.05, .35, -.25); S.add(c);
  cam = new THREE.PerspectiveCamera(28, W / H, .1, 100); cam.position.set(0, 0, 5); cam.lookAt(0, 0, 0);
} else if (SC === 'coin2') {
  const c = coin(PEARL); c.rotation.set(.5, -.4, .6); S.add(c);
  cam = new THREE.PerspectiveCamera(28, W / H, .1, 100); cam.position.set(0, 0, 5); cam.lookAt(0, 0, 0);
}
const key = new THREE.DirectionalLight(0xfff4e6, 1.25); key.position.set(-4, 6, 6); S.add(key);
const fill = new THREE.DirectionalLight(0xe8f0ff, .45); fill.position.set(5, 1, 4); S.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, .8); rim.position.set(2, 4, -6); S.add(rim);
S.add(new THREE.HemisphereLight(0xffffff, 0x444444, .25));
R.render(S, cam);
window.__pos = out; window.__done = true;
</script></body></html>
