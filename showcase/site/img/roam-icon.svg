<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1FC2B5"/><stop offset="0.55" stop-color="#0E8C8C"/><stop offset="1" stop-color="#075A63"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF1C9"/><stop offset="1" stop-color="#FFD98A"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="742" cy="282" r="136" fill="url(#sun)"/>
    <!-- horizon: two soft sea bands -->
    <path d="M0 760 C 220 720 380 790 560 760 S 860 720 1024 750 V1024 H0Z" fill="#0A6C72" opacity=".55"/>
    <path d="M0 850 C 260 820 420 880 620 852 S 900 820 1024 840 V1024 H0Z" fill="#06525A" opacity=".6"/>
    <!-- the looping flight path: pin → loop → paper plane -->
    <path d="M318 640 C 380 440 600 360 772 404" fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round" stroke-dasharray="0.1 96"/>
    <!-- map pin at the start -->
    <path d="M300 830 C 238 760 196 712 196 650 a104 104 0 0 1 208 0 c0 62 -42 110 -104 180z" fill="#fff"/>
    <circle cx="300" cy="650" r="40" fill="#0E8C8C"/>
    <!-- paper plane at the end -->
    <g transform="translate(800 400) rotate(-8) scale(1.35)">
      <path d="M-70 -46 L80 0 L-70 46 L-40 0 Z" fill="#fff"/>
      <path d="M-40 0 L80 0 L-70 46 Z" fill="#DDF3F1"/>
    </g>
    <rect width="1024" height="1024" fill="url(#gloss)"/>
  </g>
</svg>
